{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=ar1" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=ar1">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=ar1" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png?v=ar1" sizes="16x16">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png?v=ar1">
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=ar1">
<meta name="msapplication-TileColor" content="#3949ab">
<meta name="msapplication-config" content="none">
<meta name="theme-color" content="#3949ab">

{% if page.math %}
<!-- MathJax: opt in per page with `math: true` in front matter -->
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
