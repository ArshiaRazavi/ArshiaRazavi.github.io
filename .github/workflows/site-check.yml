name: Site check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Matches the Ruby GitHub Pages builds with. Gemfile.lock is gitignored,
      # so setup-ruby resolves one from the Gemfile before caching.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build

      - name: Install html-proofer
        run: gem install html-proofer --version "~> 5.0" --no-document

      # _includes/base_path renders internal links as absolute site.url links;
      # swap them to root-relative so they are checked as internal, not skipped
      # as external.
      - name: Check links, images and scripts
        run: >-
          htmlproofer ./_site
          --checks Links,Images,Scripts
          --disable-external
          --swap-urls '^https\://arshiarazavi\.github\.io:'
